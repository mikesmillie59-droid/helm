<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Helm — Stage 1</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<style>
  /* ---------- Palette: deck-plate grey, chart buff, and one safety orange ---------- */
  :root{
    --slate:#2A3238;      /* panel background */
    --slate-2:#37424A;    /* raised rows */
    --buff:#F2E9D8;       /* text on slate */
    --buff-dim:#B9B0A0;
    --orange:#F26A21;     /* hazards + the Start button */
    --green:#7BC47F;      /* waypoints + live GPS */
    --line:#4A565F;
    --panel-w:340px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--slate);
    font-family:-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif;color:var(--buff);}
  #app{display:grid;grid-template-columns:1fr var(--panel-w);height:100%;height:100dvh}
  #map{height:100%;background:#cfd8dc}
  /* Big touch targets everywhere: 56px minimum, helm gloves in mind */
  button{font:inherit;border:0;border-radius:10px;min-height:56px;padding:0 18px;
    font-size:18px;font-weight:600;cursor:pointer;color:var(--buff);background:var(--slate-2)}
  button:focus-visible{outline:3px solid var(--green);outline-offset:2px}
  button.primary{background:var(--orange);color:#1a1a1a}
  button.on{background:var(--green);color:#1a1a1a}
  input,select{font:inherit;font-size:18px;min-height:56px;border-radius:10px;border:1px solid var(--line);
    background:#1F262B;color:var(--buff);padding:0 14px;width:100%}

  /* ---------- Side panel ---------- */
  #panel{display:flex;flex-direction:column;border-left:1px solid var(--line);overflow:hidden}
  .readout{padding:18px 20px 12px;border-bottom:1px solid var(--line)}
  .readout .big{font-size:52px;font-weight:700;line-height:1;letter-spacing:-1px;font-variant-numeric:tabular-nums}
  .readout .big small{font-size:18px;font-weight:500;color:var(--buff-dim);margin-left:6px;letter-spacing:0}
  .readout .row{display:flex;justify-content:space-between;gap:12px;margin-top:10px;font-size:17px;color:var(--buff-dim)}
  .readout .row b{color:var(--buff);font-weight:600;font-variant-numeric:tabular-nums}
  #gps{display:inline-block;width:12px;height:12px;border-radius:50%;background:#777;margin-right:8px;vertical-align:middle}
  #gps.live{background:var(--green);box-shadow:0 0 0 4px rgba(123,196,127,.25)}

  .controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px 20px;border-bottom:1px solid var(--line)}
  .controls .full{grid-column:1/-1}

  #list{flex:1;overflow-y:auto;padding:10px 20px 20px}
  #list h2{font-size:15px;font-weight:600;color:var(--buff-dim);margin:10px 0 8px}
  .wp{display:grid;grid-template-columns:14px 1fr auto;gap:12px;align-items:center;
    padding:12px 0;border-bottom:1px solid var(--line)}
  .wp .dot{width:14px;height:14px;border-radius:50%;background:var(--green)}
  .wp.hazard .dot{background:var(--orange);border-radius:2px;transform:rotate(45deg)}
  .wp .name{font-size:19px;font-weight:600}
  .wp .meta{font-size:15px;color:var(--buff-dim);margin-top:2px;font-variant-numeric:tabular-nums}
  .wp button{min-height:44px;padding:0 14px;font-size:15px;font-weight:500;background:transparent;
    border:1px solid var(--line);color:var(--buff-dim)}
  .empty{padding:18px 0;color:var(--buff-dim);font-size:17px;line-height:1.45}

  /* ---------- Add-waypoint sheet ---------- */
  #sheet{display:none;position:absolute;left:20px;bottom:20px;width:min(380px,calc(100% - 40px));
    background:var(--slate);border:1px solid var(--line);border-radius:14px;padding:18px;z-index:1000;
    box-shadow:0 12px 40px rgba(0,0,0,.35)}
  #sheet.open{display:block}
  #sheet h3{margin:0 0 12px;font-size:20px}
  #sheet .field{margin-bottom:12px}
  #sheet label{display:block;font-size:15px;color:var(--buff-dim);margin-bottom:6px}
  #sheet .actions{display:flex;gap:10px;margin-top:6px}
  #sheet .actions button{flex:1}
  #hint{position:absolute;top:16px;left:50%;transform:translateX(-50%);z-index:1000;background:var(--orange);
    color:#1a1a1a;padding:12px 18px;border-radius:10px;font-size:18px;font-weight:600;display:none}
  #hint.show{display:block}

  /* ---------- Boat icon ---------- */
  .boat{width:0;height:0}
  .boat svg{width:44px;height:44px;margin:-22px 0 0 -22px;transform-origin:center;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}

  /* ---------- Narrow screens (phone / portrait) ---------- */
  @media (max-width:820px){
    #app{grid-template-columns:1fr;grid-template-rows:1fr auto}
    #panel{border-left:0;border-top:1px solid var(--line);max-height:48%}
    .readout .big{font-size:40px}
  }
</style>
</head>
<body>
<div id="app">
  <div id="map"></div>
  <div id="hint">Tap the map where you want the waypoint</div>

  <div id="sheet">
    <h3>New waypoint</h3>
    <div class="field"><label for="wpName">Name (this is what gets spoken)</label>
      <input id="wpName" placeholder="e.g. Rocks off Rakino"></div>
    <div class="field"><label for="wpType">Type</label>
      <select id="wpType"><option value="waypoint">Waypoint</option><option value="hazard">Hazard</option></select></div>
    <div class="field"><label for="wpRadius">Alert when within (metres)</label>
      <input id="wpRadius" type="number" inputmode="numeric" value="200"></div>
    <div class="actions"><button id="wpCancel">Cancel</button><button id="wpSave" class="primary">Save waypoint</button></div>
  </div>

  <aside id="panel">
    <div class="readout">
      <div><span id="gps"></span><span id="gpsText">GPS off</span></div>
      <div class="big" id="sog">—<small>knots</small></div>
      <div class="row"><span>Course</span><b id="cog">—</b></div>
      <div class="row"><span>Position</span><b id="pos">—</b></div>
      <div class="row"><span>Accuracy</span><b id="acc">—</b></div>
      <div class="row"><span>Nearest</span><b id="nearest">—</b></div>
    </div>
    <div class="controls">
      <button id="start" class="primary full">Start GPS</button>
      <button id="add">Add waypoint</button>
      <button id="follow" class="on">Follow boat</button>
      <button id="testVoice">Test voice</button>
      <button id="demo">Demo run</button>
    </div>
    <div id="list"></div>
  </aside>
</div>

<script>
// ===================== 1. Map =====================
const map = L.map('map', {zoomControl:false}).setView([-36.83, 174.85], 12); // Waitematā Harbour
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:18,
  attribution:'© OpenStreetMap'}).addTo(map);
L.control.zoom({position:'topright'}).addTo(map);
L.control.scale({imperial:false}).addTo(map);

// ===================== 2. Waypoints (saved on the device) =====================
const KEY = 'helm.waypoints';
let waypoints = JSON.parse(localStorage.getItem(KEY) || '[]');
const save = () => localStorage.setItem(KEY, JSON.stringify(waypoints));
const wpLayer = L.layerGroup().addTo(map);

function drawWaypoints(){
  wpLayer.clearLayers();
  waypoints.forEach(w=>{
    const colour = w.type==='hazard' ? '#F26A21' : '#3E9B45';
    L.circle([w.lat,w.lng],{radius:w.radius,color:colour,weight:1.5,fillOpacity:.08}).addTo(wpLayer);
    L.circleMarker([w.lat,w.lng],{radius:8,color:'#fff',weight:2,fillColor:colour,fillOpacity:1})
      .bindTooltip(w.name,{permanent:true,direction:'top',offset:[0,-8]}).addTo(wpLayer);
  });
  renderList();
}

function renderList(){
  const el = document.getElementById('list');
  if(!waypoints.length){
    el.innerHTML = '<div class="empty">No waypoints yet. Tap <b>Add waypoint</b>, then tap the map. The name you give it is what the app will say out loud.</div>';
    return;
  }
  el.innerHTML = '<h2>Waypoints and hazards</h2>' + waypoints.map((w,i)=>`
    <div class="wp ${w.type}" data-i="${i}">
      <div class="dot"></div>
      <div><div class="name">${esc(w.name)}</div>
        <div class="meta">${w.type==='hazard'?'Hazard':'Waypoint'} · alert at ${w.radius} m · <span class="dist" data-i="${i}">—</span></div></div>
      <button data-del="${i}">Remove</button>
    </div>`).join('');
  el.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.del; if(confirm('Remove "'+waypoints[i].name+'"?')){waypoints.splice(i,1);save();drawWaypoints();}
  });
  el.querySelectorAll('.wp').forEach(r=>r.onclick=e=>{
    if(e.target.tagName==='BUTTON')return;
    const w=waypoints[+r.dataset.i]; following=false; setFollow(); map.setView([w.lat,w.lng],15);
  });
}
const esc = s => s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// --- Adding a waypoint: press button, tap map, fill sheet ---
let placing=false, pending=null;
const sheet=document.getElementById('sheet'), hint=document.getElementById('hint');
document.getElementById('add').onclick=()=>{placing=true;hint.classList.add('show');};
map.on('click',e=>{
  if(!placing)return;
  placing=false; hint.classList.remove('show'); pending=e.latlng;
  document.getElementById('wpName').value=''; sheet.classList.add('open');
  document.getElementById('wpName').focus();
});
document.getElementById('wpCancel').onclick=()=>sheet.classList.remove('open');
document.getElementById('wpSave').onclick=()=>{
  const name=document.getElementById('wpName').value.trim();
  if(!name){alert('Give it a name — that is what gets spoken.');return;}
  waypoints.push({name, type:document.getElementById('wpType').value,
    radius:Math.max(20,+document.getElementById('wpRadius').value||200), lat:pending.lat, lng:pending.lng, inside:false});
  save(); drawWaypoints(); sheet.classList.remove('open');
};

// ===================== 3. Voice =====================
function speak(text){
  if(!('speechSynthesis' in window))return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text); u.lang='en-NZ'; u.rate=0.95;
  speechSynthesis.speak(u);
}
document.getElementById('testVoice').onclick=()=>speak('Voice check. Approaching Rangitoto beacon, 200 metres.');

// ===================== 4. Boat + GPS =====================
const boatIcon=L.divIcon({className:'boat',html:
 `<svg viewBox="0 0 44 44"><path id="hull" d="M22 4 L34 36 L22 30 L10 36 Z" fill="#F26A21" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg>`});
let boat=null, accCircle=null, following=true, watchId=null, lastFix=null;

function setFollow(){document.getElementById('follow').classList.toggle('on',following);}
document.getElementById('follow').onclick=()=>{following=!following;setFollow();if(following&&lastFix)map.panTo([lastFix.lat,lastFix.lng]);};
map.on('dragstart',()=>{following=false;setFollow();});

function onFix(lat,lng,speedMs,heading,accuracy){
  lastFix={lat,lng};
  if(!boat){boat=L.marker([lat,lng],{icon:boatIcon,zIndexOffset:1000}).addTo(map);
            accCircle=L.circle([lat,lng],{radius:accuracy||0,color:'#2A3238',weight:1,fillOpacity:.05}).addTo(map);
            map.setView([lat,lng],15);}
  boat.setLatLng([lat,lng]); accCircle.setLatLng([lat,lng]).setRadius(accuracy||0);
  if(heading!=null&&!isNaN(heading)){const h=boat.getElement()?.querySelector('svg'); if(h)h.style.transform=`rotate(${heading}deg)`;}
  if(following)map.panTo([lat,lng],{animate:true});

  const kn=speedMs!=null?(speedMs*1.94384):null;
  document.getElementById('sog').innerHTML=(kn!=null?kn.toFixed(1):'—')+'<small>knots</small>';
  document.getElementById('cog').textContent=heading!=null&&!isNaN(heading)?Math.round(heading)+'°':'—';
  document.getElementById('pos').textContent=fmtPos(lat,lng);
  document.getElementById('acc').textContent=accuracy?'± '+Math.round(accuracy)+' m':'—';
  checkAlerts(lat,lng);
}

function fmtPos(lat,lng){
  const dm=(v,pn)=>{const a=Math.abs(v),d=Math.floor(a),m=((a-d)*60).toFixed(3);return `${d}° ${m}' ${v<0?pn[1]:pn[0]}`;};
  return dm(lat,'NS')+'  '+dm(lng,'EW');
}
function distance(a,b,c,d){ // metres between two lat/lng points
  const R=6371000,toR=x=>x*Math.PI/180,dLat=toR(c-a),dLng=toR(d-b);
  const h=Math.sin(dLat/2)**2+Math.cos(toR(a))*Math.cos(toR(c))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}

// --- The alert logic: speak once when entering a radius, reset once well clear of it ---
function checkAlerts(lat,lng){
  let nearest=null;
  waypoints.forEach((w,i)=>{
    const d=distance(lat,lng,w.lat,w.lng);
    const el=document.querySelector(`.dist[data-i="${i}"]`); if(el)el.textContent=fmtDist(d);
    if(!nearest||d<nearest.d)nearest={w,d};
    if(d<=w.radius&&!w.inside){
      w.inside=true;
      speak((w.type==='hazard'?'Caution. Hazard. ':'Approaching ')+w.name+', '+Math.round(d/10)*10+' metres.');
    } else if(d>w.radius*1.3&&w.inside){ w.inside=false; }   // 30% buffer so it doesn't re-trigger on the edge
  });
  document.getElementById('nearest').textContent=nearest?nearest.w.name+' '+fmtDist(nearest.d):'—';
}
const fmtDist=d=>d<1000?Math.round(d)+' m':(d/1852).toFixed(2)+' nm';

// --- Start: one tap unlocks GPS, voice and keep-awake (iPad needs a user tap for all three) ---
const startBtn=document.getElementById('start');
startBtn.onclick=async()=>{
  if(watchId!=null){navigator.geolocation.clearWatch(watchId);watchId=null;stopDemo();
    startBtn.textContent='Start GPS';startBtn.classList.add('primary');setGps(false,'GPS off');return;}
  if(!navigator.geolocation){alert('This browser has no location support.');return;}
  speak('Helm ready.');                         // warms up the voice so later alerts play
  try{ if('wakeLock' in navigator) await navigator.wakeLock.request('screen'); }catch(e){}
  setGps(false,'Waiting for satellites…');
  watchId=navigator.geolocation.watchPosition(p=>{
      setGps(true,'GPS live');
      onFix(p.coords.latitude,p.coords.longitude,p.coords.speed,p.coords.heading,p.coords.accuracy);
    }, err=>{ setGps(false,'GPS error: '+err.message); },
    {enableHighAccuracy:true,maximumAge:1000,timeout:20000});
  startBtn.textContent='Stop GPS';startBtn.classList.remove('primary');
};
function setGps(live,text){document.getElementById('gps').classList.toggle('live',live);document.getElementById('gpsText').textContent=text;}

// ===================== 5. Demo run (test at the desk without moving) =====================
// Drives a pretend boat from the map centre through every waypoint at ~8 knots.
let demoTimer=null;
function stopDemo(){if(demoTimer){clearInterval(demoTimer);demoTimer=null;document.getElementById('demo').classList.remove('on');}}
document.getElementById('demo').onclick=()=>{
  if(demoTimer){stopDemo();return;}
  if(!waypoints.length){alert('Add a waypoint or two first, then run the demo.');return;}
  if(watchId!=null)startBtn.onclick();          // switch real GPS off while pretending
  speak('Demo run started.');
  document.getElementById('demo').classList.add('on');
  waypoints.forEach(w=>w.inside=false);
  let c=map.getCenter(), pos={lat:c.lat,lng:c.lng}, idx=0;
  demoTimer=setInterval(()=>{
    const t=waypoints[idx]; if(!t){stopDemo();speak('Demo run finished.');return;}
    const d=distance(pos.lat,pos.lng,t.lat,t.lng), step=4.1; // metres per tick ≈ 8 kn at 1 tick/sec
    if(d<step){idx++;return;}
    const f=step/d; pos={lat:pos.lat+(t.lat-pos.lat)*f,lng:pos.lng+(t.lng-pos.lng)*f};
    const hdg=(Math.atan2(t.lng-pos.lng,t.lat-pos.lat)*180/Math.PI+360)%360;
    setGps(true,'Demo (pretend GPS)');
    onFix(pos.lat,pos.lng,4.1,hdg,5);
  },1000);
};

drawWaypoints();
</script>
</body>
</html>
